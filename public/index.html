<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees · Oracle Demo</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">NestJS + Oracle</p><h1>Employees</h1></div>
      <span class="status" id="status">Not connected</span>
    </header>
    <section class="card" aria-label="Employee query">
      <div class="auth-bar">
        <span id="account">Not signed in</span>
        <button id="login" class="secondary" disabled>Sign in with Azure</button>
        <button id="logout" class="secondary" hidden>Sign out</button>
      </div>
      <div id="device" class="device" hidden>
        Open <a id="verification" target="_blank" rel="noopener noreferrer">Microsoft sign-in</a> and enter <strong id="user-code"></strong>.
      </div>
      <div class="toolbar">
        <details>
          <summary>View SQL</summary>
          <pre><code id="sql">Loading…</code></pre>
        </details>
        <button id="run" disabled>Load employees</button>
      </div>
      <div id="empty" class="empty">No employees loaded.</div>
      <div id="error" class="error" role="alert" hidden></div>
      <div id="results" hidden>
        <div class="table-scroll"><table aria-label="Employees"><thead id="columns"></thead><tbody id="rows"></tbody></table></div>
        <div class="meta"><span><span id="count"></span> row(s)</span><span id="duration"></span></div>
      </div>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
